<!doctype html><html><head><meta charset='utf-8'><title>Listening test</title>
<style>body{font-family:sans-serif;max-width:900px;margin:auto;padding:16px;line-height:1.4}
.c{display:flex;align-items:center;gap:12px;margin:8px 0}.c input[type=range]{flex:1}
.box{background:#f4f4f4;padding:10px;border-radius:6px;margin:10px 0}
button{padding:8px 16px;font-size:15px}#done{display:none}.zh{color:#444}</style></head><body>
<h1 id='title'></h1><p id='intro_en'></p><p id='intro_zh' class='zh'></p>
<div id='trial'><h2 id='tname'></h2>
<div class='box'><b>Original / 原录音</b> <audio id='orig' controls></audio><p id='o_en'></p><p id='o_zh' class='zh'></p><p id='audio_err' style='color:#a00'></p></div>
<div class='box'><b>The change / 改动</b><p id='e_en'></p><p id='e_zh' class='zh'></p></div>
<p><b>How much do you agree that each clip is the original with exactly this change? / 你多大程度认同每个片段就是原录音做了这一改动？</b> (0 = not at all 完全不认同, 100 = completely 完全认同)</p>
<div id='conds'></div>
<button id='next'>Next / 下一题</button></div>
<div id='done'><h2>Thank you. / 谢谢。</h2><p>Download your answers and send the file back. / 请下载结果文件并发回。</p>
<button id='dl'>Download results / 下载结果</button></div>
<script>window.LT_CONFIG = {"title": "Audio edit listening test / 音频编辑听音测试", "intro_en": "Each trial plays an ORIGINAL recording and describes one change that should be made to it. Listen to the original first, then to every clip. For each clip, rate how much you agree that it is the original with exactly this change and nothing else (0 = not at all, 100 = completely). Use headphones. Replay as often as you like.", "intro_zh": "每一题先播放原录音，并说明应该对它做的一个改动。先听原录音，再听每个片段。对每个片段打分：你在多大程度上认同它就是原录音做了这一改动而且没有其他变化（0 完全不认同，100 完全认同）。请戴耳机，可反复播放。", "trials": [{"id": "E1_00899", "edit": "E1", "scene": 899, "original_en": "The original recording contains an engine passing by and an alarm, in the open air.", "original_zh": "原录音里有引擎声（经过）和警报声，在室外。", "edit_en": "The engine is removed. The alarm must stay exactly as in the original.", "edit_zh": "去掉引擎声。警报声必须和原录音完全一样。", "original": "stimuli/E1_00899_orig.wav", "conditions": {"gt": "stimuli/E1_00899_gt.wav", "orig": "stimuli/E1_00899_orig.wav", "ours": "stimuli/E1_00899_ours.wav", "x1": "stimuli/E1_00899_x1.wav", "x3": "stimuli/E1_00899_x3.wav"}}, {"id": "E1_01289", "edit": "E1", "scene": 1289, "original_en": "The original recording contains an alarm passing by and a door, in the open air.", "original_zh": "原录音里有警报声（经过）和门声，在室外。", "edit_en": "The door is removed. The alarm must stay exactly as in the original.", "edit_zh": "去掉门声。警报声必须和原录音完全一样。", "original": "stimuli/E1_01289_orig.wav", "conditions": {"gt": "stimuli/E1_01289_gt.wav", "orig": "stimuli/E1_01289_orig.wav", "ours": "stimuli/E1_01289_ours.wav", "x1": "stimuli/E1_01289_x1.wav", "x3": "stimuli/E1_01289_x3.wav"}}, {"id": "E1_01190", "edit": "E1", "scene": 1190, "original_en": "The original recording contains an engine and a hammer, in the open air.", "original_zh": "原录音里有引擎声和锤击声，在室外。", "edit_en": "The hammer is removed. The engine must stay exactly as in the original.", "edit_zh": "去掉锤击声。引擎声必须和原录音完全一样。", "original": "stimuli/E1_01190_orig.wav", "conditions": {"gt": "stimuli/E1_01190_gt.wav", "orig": "stimuli/E1_01190_orig.wav", "ours": "stimuli/E1_01190_ours.wav", "x1": "stimuli/E1_01190_x1.wav", "x3": "stimuli/E1_01190_x3.wav"}}, {"id": "E2_01211", "edit": "E2", "scene": 1211, "original_en": "The original recording contains an engine passing by, in the open air.", "original_zh": "原录音里有引擎声（经过），在室外。", "edit_en": "The engine passes by at 10 m/s instead of 39 m/s, that is slower. The pitch drop as it passes should be smaller and more gradual, and the rise and fall of loudness should be longer.", "edit_zh": "引擎声以 10 m/s 而不是 39 m/s 经过，也就是变慢了。经过时的音高下落应当更小更缓，响度的起落应当更长。", "original": "stimuli/E2_01211_orig.wav", "conditions": {"gt": "stimuli/E2_01211_gt.wav", "orig": "stimuli/E2_01211_orig.wav", "ours": "stimuli/E2_01211_ours.wav", "x1": "stimuli/E2_01211_x1.wav", "x3": "stimuli/E2_01211_x3.wav", "x6": "stimuli/E2_01211_x6.wav"}}, {"id": "E2_01231", "edit": "E2", "scene": 1231, "original_en": "The original recording contains an engine passing by, in the open air.", "original_zh": "原录音里有引擎声（经过），在室外。", "edit_en": "The engine passes by at 20 m/s instead of 6 m/s, that is faster. The pitch drop as it passes should be larger and quicker, and the rise and fall of loudness should be shorter.", "edit_zh": "引擎声以 20 m/s 而不是 6 m/s 经过，也就是变快了。经过时的音高下落应当更大更急，响度的起落应当更短。", "original": "stimuli/E2_01231_orig.wav", "conditions": {"gt": "stimuli/E2_01231_gt.wav", "orig": "stimuli/E2_01231_orig.wav", "ours": "stimuli/E2_01231_ours.wav", "x1": "stimuli/E2_01231_x1.wav", "x3": "stimuli/E2_01231_x3.wav", "x6": "stimuli/E2_01231_x6.wav"}}, {"id": "E3_00720", "edit": "E3", "scene": 720, "original_en": "The original recording contains an engine and a door, in a room (absorption 0.30).", "original_zh": "原录音里有引擎声和门声，在一个房间里（吸声系数 0.30）。", "edit_en": "The door is moved 4 times farther away: it should sound quieter and more distant, with relatively more room sound. The engine must stay exactly as in the original.", "edit_zh": "门声被移到4 倍远的位置：它应当听起来更轻更远，房间混响的比例更大。引擎声必须和原录音完全一样。", "original": "stimuli/E3_00720_orig.wav", "conditions": {"gt": "stimuli/E3_00720_gt.wav", "orig": "stimuli/E3_00720_orig.wav", "ours": "stimuli/E3_00720_ours.wav", "x1": "stimuli/E3_00720_x1.wav", "x3": "stimuli/E3_00720_x3.wav"}}, {"id": "E3_01521", "edit": "E3", "scene": 1521, "original_en": "The original recording contains a hammer and an engine, in a room (absorption 0.50).", "original_zh": "原录音里有锤击声和引擎声，在一个房间里（吸声系数 0.50）。", "edit_en": "The hammer is moved 4 times farther away: it should sound quieter and more distant, with relatively more room sound. The engine must stay exactly as in the original.", "edit_zh": "锤击声被移到4 倍远的位置：它应当听起来更轻更远，房间混响的比例更大。引擎声必须和原录音完全一样。", "original": "stimuli/E3_01521_orig.wav", "conditions": {"gt": "stimuli/E3_01521_gt.wav", "orig": "stimuli/E3_01521_orig.wav", "ours": "stimuli/E3_01521_ours.wav", "x1": "stimuli/E3_01521_x1.wav", "x3": "stimuli/E3_01521_x3.wav"}}, {"id": "E4_01522", "edit": "E4", "scene": 1522, "original_en": "The original recording contains a hammer, in a room (absorption 0.45).", "original_zh": "原录音里有锤击声，在一个房间里（吸声系数 0.45）。", "edit_en": "The room becomes less absorbing (absorption 0.45 to 0.30): the reverberation tail after each sound becomes longer. The sounds themselves stay the same.", "edit_zh": "房间变得更不吸声（吸声系数 0.45 变为 0.30）：每个声音之后的混响尾巴应当变长。声音本身不变。", "original": "stimuli/E4_01522_orig.wav", "conditions": {"gt": "stimuli/E4_01522_gt.wav", "orig": "stimuli/E4_01522_orig.wav", "ours": "stimuli/E4_01522_ours.wav"}}, {"id": "E4_00131", "edit": "E4", "scene": 131, "original_en": "The original recording contains a tapping sound, in a room (absorption 0.50).", "original_zh": "原录音里有轻敲声，在一个房间里（吸声系数 0.50）。", "edit_en": "The room becomes less absorbing (absorption 0.50 to 0.30): the reverberation tail after each sound becomes longer. The sounds themselves stay the same.", "edit_zh": "房间变得更不吸声（吸声系数 0.50 变为 0.30）：每个声音之后的混响尾巴应当变长。声音本身不变。", "original": "stimuli/E4_00131_orig.wav", "conditions": {"gt": "stimuli/E4_00131_gt.wav", "orig": "stimuli/E4_00131_orig.wav", "ours": "stimuli/E4_00131_ours.wav"}}, {"id": "E4_00108", "edit": "E4", "scene": 108, "original_en": "The original recording contains a thump and a gunshot, in a room (absorption 0.35).", "original_zh": "原录音里有重击声和枪声，在一个房间里（吸声系数 0.35）。", "edit_en": "The room becomes more absorbing (absorption 0.35 to 0.50): the reverberation tail after each sound becomes shorter. The sounds themselves stay the same.", "edit_zh": "房间变得更吸声（吸声系数 0.35 变为 0.50）：每个声音之后的混响尾巴应当变短。声音本身不变。", "original": "stimuli/E4_00108_orig.wav", "conditions": {"gt": "stimuli/E4_00108_gt.wav", "orig": "stimuli/E4_00108_orig.wav", "ours": "stimuli/E4_00108_ours.wav"}}]};</script>
<script>
let cfg, t = 0, res = {listener: '', answers: []};
const shuffle = a => {for (let i = a.length - 1; i > 0; i--) {const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]];} return a;};
const $ = id => document.getElementById(id);
function start(){ try { cfg = window.LT_CONFIG; $('title').textContent = cfg.title; $('intro_en').textContent = cfg.intro_en; $('intro_zh').textContent = cfg.intro_zh;
 res.listener = prompt('Listener ID (any name or number) / 听者编号') || 'anon'; res.started = new Date().toISOString();
 res.order = shuffle(cfg.trials.map((_, i) => i)); show(); } catch (err) {
 $('intro_en').textContent = 'The page could not start (' + err + '). Please unzip the whole folder and open index.html from it. / 页面无法启动，请先解压整个文件夹，再从解压后的文件夹打开 index.html。'; } }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
function show(){ if (t >= cfg.trials.length) {$('trial').style.display='none'; $('done').style.display='block'; return;}
 const tr = cfg.trials[res.order[t]]; $('tname').textContent = 'Trial ' + (t+1) + ' of ' + cfg.trials.length;
 $('orig').src = tr.original; $('o_en').textContent = tr.original_en; $('o_zh').textContent = tr.original_zh;
 $('audio_err').textContent = ''; $('orig').onerror = () => {$('audio_err').textContent = 'Audio file not found: keep the stimuli folder next to index.html. / 找不到音频，请保持 stimuli 文件夹和 index.html 在同一目录。';};
 $('e_en').textContent = tr.edit_en; $('e_zh').textContent = tr.edit_zh;
 const d = $('conds'); d.innerHTML = '';
 shuffle(Object.keys(tr.conditions)).forEach((k, n) => {d.innerHTML += `<div class='c'><span>Clip ${String.fromCharCode(65+n)}</span><audio controls src='${tr.conditions[k]}'></audio><input type='range' min='0' max='100' value='50' data-k='${k}'><span class='v'>50</span></div>`;});
 d.querySelectorAll('input').forEach(i => i.oninput = e => e.target.nextElementSibling.textContent = e.target.value);
 window.scrollTo(0, 0); }
$('next').onclick = () => {const tr = cfg.trials[res.order[t]]; const a = {trial: tr.id, edit: tr.edit, ratings: {}};
 document.querySelectorAll('#conds input').forEach(i => a.ratings[i.dataset.k] = +i.value); res.answers.push(a); t++; show();};
$('dl').onclick = () => {res.finished = new Date().toISOString(); const b = new Blob([JSON.stringify(res, null, 1)], {type: 'application/json'});
 const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'listening_' + res.listener + '.json'; a.click();};
</script></body></html>
